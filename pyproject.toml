[project]
name = "precim"
version = "0.1.0"
description = "Caçador de ofertas lúdico: acompanha preços de SSD e avisa no Telegram."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "selectolax>=0.3",
  "apscheduler>=3.10,<4",
  "python-telegram-bot>=21",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21", "ruff>=0.6", "pytest-asyncio>=0.24"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
src = ["backend"]
