services:
  precim:
    build: .
    ports:
      - "127.0.0.1:${PRECIM_PORT:-8000}:8000"
    env_file:
      - .env
    volumes:
      - precim-data:/data
      # cópias do banco também fora do volume do Docker (sobrevive a `docker compose down -v`)
      - ${PRECIM_BACKUP_HOST_DIR:-./backups}:/data/backups
    restart: unless-stopped

volumes:
  precim-data:
